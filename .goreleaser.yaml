version: 2

project_name: meshscan

builds:
  - id: meshscan
    main: ./cmd/meshscan
    binary: meshscan
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/n0rm4l-me/meshscan/internal/version.Version={{ .Version }}
      - -X github.com/n0rm4l-me/meshscan/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/n0rm4l-me/meshscan/internal/version.Date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^ci:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
