version: "2"

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - copyloopvar
    - nolintlint
  settings:
    errcheck:
      # Failing to write a report line to a terminal or buffer is not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/n0rm4l-me/meshscan
